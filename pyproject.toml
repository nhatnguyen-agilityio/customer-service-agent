[project]
name = "customer-service-agent"
version = "0.0.1"
description = "Single-agent LangGraph customer service bot for a retail store, backed by Supabase."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-sdk",
    "langgraph-checkpoint-postgres",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-community",
    "langchain-core",
    "langsmith",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
    "supabase",
    "sqlalchemy",
    "psycopg[binary,pool]",
    "psycopg2-binary",
    "httpx",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/security", "src/tools", "src/db"]
